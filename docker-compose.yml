version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:3001
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: Add nginx for serving static files and reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist/client:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped